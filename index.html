<DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-weather="clear">
  <main class="app">
    <header class="topbar">
      <form id="search-form" autocomplete="off">
        <label for="city-input" class="sr-only">City name</label>
        <input id="city-input" type="text" placeholder="Search for a city" required>
        <button type="submit">Search</button>
      </form>
      <div class="units" role="group" aria-label="Temperature unit">
        <button id="unit-c" class="active" type="button">°C</button>
        <button id="unit-f" type="button">°F</button>
      </div>
    </header>
 
    <p id="message" class="message" role="status">Search for a city to see its weather.</p>
 
    <section id="current" class="current" hidden>
      <h1 id="city-name"></h1>
      <p id="condition" class="condition"></p>
      <p id="temp" class="temp"></p>
      <dl class="details">
        <div><dt>Feels like</dt><dd id="feels"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
      </dl>
    </section>
 
    <section id="forecast-section" hidden>
      <h2>Next 5 days</h2>
      <ul id="forecast" class="forecast"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
